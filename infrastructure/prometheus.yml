global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "gateway-service"
    static_configs:
      - targets: ["gateway-service:8000"]
    metrics_path: /metrics

  - job_name: "asr-service"
    static_configs:
      - targets: ["asr-service:8001"]
    metrics_path: /metrics

  - job_name: "nlu-service"
    static_configs:
      - targets: ["nlu-service:8002"]
    metrics_path: /metrics

  - job_name: "dialog-service"
    static_configs:
      - targets: ["dialog-service:8003"]
    metrics_path: /metrics

  - job_name: "notification-service"
    static_configs:
      - targets: ["notification-service:8004"]
    metrics_path: /metrics

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres:9187"]

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis:9121"]

  - job_name: "rabbitmq-exporter"
    static_configs:
      - targets: ["rabbitmq:9419"]