syntax = "proto3";

package voice_assistant.tts;

import "audio.proto";

// TTS messages
message TTSRequest {
    string text = 1;
    string voice_id = 2;
    int32 sample_rate = 3;
    string format = 4;
    string session_id = 5;
    string language = 6;
    map<string, string> config = 7;
}

message TTSResponse {
    string session_id = 1;
    bool success = 2;
    string error_message = 3;
    int32 total_chunks = 4;
}

// TTS Service
service TTSService {
    rpc SynthesizeSpeech(TTSRequest) returns (stream voice_assistant.audio.AudioChunk);
    rpc GetAvailableVoices(VoicesRequest) returns (VoicesResponse);
}

message VoicesRequest {
    string language = 1;
}

message VoicesResponse {
    repeated VoiceInfo voices = 1;
}

message VoiceInfo {
    string voice_id = 1;
    string name = 2;
    string language = 3;
    string gender = 4;
    map<string, string> metadata = 5;
}